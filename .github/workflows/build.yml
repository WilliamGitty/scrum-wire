name: Build The Transfer Wire

on:
  schedule:
    # Three staggered times: GitHub Actions cron can be delayed or dropped
    # during high-load periods (worst at the top of the hour, when huge
    # numbers of repos schedule jobs). If one gets dropped, the others
    # almost certainly won't be. Running more than once is harmless - the
    # page just rebuilds from the live feeds again.
    - cron: "30 6 * * *"
    - cron: "0 7 * * *"
    - cron: "30 7 * * *"
  workflow_dispatch: {}
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build the transfers page
        run: python scripts/build.py

      - name: Build the fixtures & results page
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python scripts/fixtures.py

      - name: Commit updated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html fixtures.html
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily transfer news + fixtures update"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
